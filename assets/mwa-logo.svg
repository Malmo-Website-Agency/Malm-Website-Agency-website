  <g stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="225" y1="70" x2="225" y2="180"/>
    <line x1="275" y1="70" x2="275" y2="180"/>
    <line x1="225" y1="75" x2="150" y2="180"/>
    <line x1="225" y1="75" x2="170" y2="180"/>
