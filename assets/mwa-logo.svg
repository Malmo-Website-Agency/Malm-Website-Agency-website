    <line x1="225" y1="75" x2="210" y2="180"/>
    <line x1="275" y1="75" x2="350" y2="180"/>
    <line x1="275" y1="75" x2="330" y2="180"/>
    <line x1="275" y1="75" x2="310" y2="180"/>
    <line x1="275" y1="75" x2="290" y2="180"/>
    <line x1="205" y1="186" x2="205" y2="215"/>
    <line x1="295" y1="186" x2="295" y2="215"/>
    <line x1="120" y1="222" x2="150" y2="222"/>
