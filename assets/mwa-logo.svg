<text x="250" y="302" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="54" letter-spacing="8" fill="#FFFFFF">M.W.A.</text>
<text x="250" y="350" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="25" letter-spacing="5" fill="#FFFFFF">MALMÖ WEBSITE AGENCY</text>
